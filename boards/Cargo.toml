[workspace]

resolver = "2"
members = ["update",
           "hal", 
           "firmware/*/*", 
           "bootloaders/*"
           ]
# THEJAS32 is RISC-V and builds on its own; see bootloaders/thejas32/README.md
exclude = ["bootloaders/thejas32"]

[profile.dev]
incremental = false
codegen-units = 1
debug = true
lto = false

[profile.release]
debug = true
lto = true
opt-level = 2
